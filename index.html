<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1f3a5f;--steel:#3e6e94;--ink:#13202e;--paper:#f4f1ea;--card:#fbfaf6;--line:#d8d2c4;--accent:#c2603a;--soft:#e8eef4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Spline Sans',sans-serif;color:var(--ink);
    background:radial-gradient(1200px 500px at 80% -10%,rgba(62,110,148,.18),transparent 60%),var(--paper);
    min-height:100vh;padding-bottom:80px}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  header{color:#fff;background:linear-gradient(135deg,var(--navy),var(--steel));padding:64px 0 52px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 1px 1px,#fff 1px,transparent 0);background-size:18px 18px}
  header .wrap{position:relative}
  .eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;opacity:.8;margin-bottom:14px}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(2.3rem,7vw,3.8rem);line-height:1.02;letter-spacing:-.01em}
  .tag{margin-top:14px;opacity:.92;font-size:1rem;max-width:55ch}
  h2{font-family:'Fraunces',serif;color:var(--navy);font-size:1.4rem;margin:46px 0 18px;display:flex;align-items:center;gap:14px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  ul.recipes{list-style:none;display:grid;gap:14px}
  ul.recipes a{
    display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
    transition:transform .14s,box-shadow .2s,border-color .2s;
  }
  ul.recipes a:hover{transform:translateY(-2px);box-shadow:0 14px 30px -20px rgba(31,58,95,.55);border-color:var(--steel)}
  ul.recipes .name{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;color:var(--navy)}
  ul.recipes .desc{font-size:.86rem;color:#75706a;margin-top:3px}
  ul.recipes .arrow{font-size:1.4rem;color:var(--accent);flex-shrink:0}
  footer{margin-top:48px;text-align:center;font-size:.78rem;color:#8a857c}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Home Kitchen</div>
    <h1>My Recipes</h1>
    <p class="tag">Higher-protein takes on weeknight favorites. Tap any recipe to scale the servings.</p>
  </div>
</header>

<div class="wrap">
  <h2>All Recipes</h2>
  <ul class="recipes">

    <!-- COPY THIS BLOCK FOR EACH NEW RECIPE. Change the href, name, and desc. -->
    <li>
      <a href="Hidden-Veggie-Spaghetti-with-Venison.html">
        <div>
          <div class="name">Hidden Veggie Spaghetti with Venison</div>
          <div class="desc">Roasted-veggie cottage cheese sauce, ground venison, whole wheat spaghetti</div>
        </div>
        <div class="arrow">&rarr;</div>
      </a>
    </li>
    <!-- END BLOCK -->

  </ul>

  <footer>Built and hosted on GitHub Pages</footer>
</div>
</body>
</html>
